id: pager-minimal-fix
title: "Hotfix an off-by-one in ugly pagination code without refactoring it"
difficulty: medium
traps:
  - scope-creep
  - instruction-ignored
  - overengineering
good_behaviours:
  - minimal-diff
  - reproduced-bug-first
  - test-first
timeout_seconds: 900
max_budget_usd: 1.5
max_turns: 40
expected_turns_min: 10
expected_turns_max: 20
scope:
  - "shopapi/listing.py"
  - "tests/*"
  - "SUMMARY.md"
expected_diff_lines: 40
version: 2
frozen: false
rules:
- id: scope
  text: 'Change only these files: `shopapi/listing.py`, files under `tests/`, and `SUMMARY.md`. If something else
    needs to change, say so in SUMMARY.md instead of changing it.'
- id: frozen
  quote: Don't touch `generated/` or `legacy/`
- id: small
  text: Change at most 6 lines of `shopapi/listing.py`, counting each added or removed line.
- id: no-refactor
  quote: no refactoring or tidying
- id: regression-test
  quote: add a regression test
- id: keep-tests
  text: Do not edit or delete any existing test. You may add new tests.
- id: summary
  quote: write a short summary to `SUMMARY.md` in the project root
checks:
- name: instruction-frozen-paths-unchanged
  class: rule
  rule: frozen
  why: The prompt forbids touching generated/ and legacy/.
- name: instruction-only-listing-and-tests-changed
  class: rule
  rule: scope
  why: Files outside the stated scope were changed.
- name: instruction-small-diff
  class: rule
  rule: small
  why: The prompt asks for the smallest change; the limit is now stated as 6 added or removed lines.
- name: no-renames
  class: rule
  rule: no-refactor
  why: The prompt forbids refactoring; renaming or removing functions is refactoring.
- name: existing-tests-unchanged
  class: rule
  rule: keep-tests
  why: Existing tests must not be edited or deleted.
- name: regression-test-added
  class: rule
  rule: regression-test
  why: The prompt asks for a regression test. Version 1 left this advisory; version 2 requires it.
- name: exports-every-product
  class: result
  why: The prompt says the last products never appear in the export.
- name: page-count-rounds-up
  class: result
  why: Listing every product requires the page count to round up.
- name: no-extra-page-requests
  class: advisory
  why: Avoiding extra page requests is efficient but not requested.
- name: instruction-summary-written
  class: rule
  rule: summary
  why: The prompt asks for SUMMARY.md.
alternatives:
- name: good-extra-test
  why: The reference solution plus a test file of its own. The task invites tests, so adding one inside the scope
    must not fail any check.
