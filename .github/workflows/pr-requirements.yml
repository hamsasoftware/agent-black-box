name: Pull request requirements

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-requirements-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  requirements:
    name: Pull request requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check description, wording, branch name and commit emails
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/check_pr_requirements.py --event "$GITHUB_EVENT_PATH" --base "origin/$BASE_REF"
