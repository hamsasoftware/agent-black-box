<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>agent-black-box hero</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:560px;overflow:hidden;background:#07090d}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#eaf0f8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
svg.i{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#vp{position:absolute;inset:0;perspective:1150px;perspective-origin:50% 40%;overflow:hidden;
 background:radial-gradient(ellipse at 50% 30%,#18202c 0%,#0b0f15 55%,#06080b 100%)}
#world{position:absolute;left:500px;top:262px;width:0;height:0;transform-style:preserve-3d}
#floor{position:absolute;left:-2400px;top:256px;width:7200px;height:1700px;transform-origin:0 0;transform:rotateX(90deg) translateY(-1400px);
 background:linear-gradient(#ff6a1322 2px,transparent 2px) 0 0/100px 100px,linear-gradient(90deg,#ff6a1322 2px,transparent 2px) 0 0/100px 100px,#0e131b}
#path{position:absolute;left:-200px;top:252px;width:3200px;height:6px;transform-origin:0 0;transform:rotateX(90deg) translateY(130px);
 background:linear-gradient(90deg,#ff6a13,#ffb347,#ff6a13);box-shadow:0 0 26px #ff6a13aa}
.card{position:absolute;left:-215px;top:-170px;width:430px;height:270px;border-radius:22px;background:linear-gradient(160deg,#171f2b,#0f141c);
 border:2px solid #2d3848;box-shadow:0 0 0 1px #000,0 30px 60px #000a;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #263041;background:#111823}
.card .no{width:34px;height:34px;border-radius:50%;background:#ff6a13;color:#12161d;font-weight:800;font-size:19px;display:grid;place-items:center}
.card .tt{font-size:24px;font-weight:800;letter-spacing:1.5px}
.card .hi{margin-left:auto;width:34px;height:34px;color:#8d9bb0}
.bd{position:relative;height:208px}
.tile{position:absolute;width:92px;height:92px;border-radius:20px;background:#1a2331;border:2px solid #2f3b4e;color:#ff9a57;padding:18px;opacity:0}
.tile.trap{border-color:#ff6a13;background:#2a1b12;color:#ffb98a}
.tile.trap::after{content:"!";position:absolute;right:-9px;top:-11px;width:26px;height:26px;border-radius:50%;background:#ff6a13;color:#12161d;font-weight:900;font-size:17px;display:grid;place-items:center}
.tile.lit{border-color:#ff6a13;box-shadow:0 0 22px #ff6a13aa;color:#fff}
.lamp{position:absolute;width:44px;height:44px;border-radius:50%;opacity:0}
.lamp.red{background:radial-gradient(circle at 35% 30%,#ffb3b3,#e5484d 55%,#5a1417);box-shadow:0 0 22px #e5484daa}
.lamp.green{background:radial-gradient(circle at 35% 30%,#c8ffd9,#2fbf71 55%,#0f4a2b);box-shadow:0 0 22px #2fbf71aa}
.arrow{position:absolute;width:54px;height:54px;color:#8d9bb0;opacity:0}
.ind{position:absolute;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900;opacity:0}
.ind.ok{background:#10261b;border:3px solid #2fbf71;color:#7ee2a0}
.ind.bad{background:#2b1315;border:3px solid #e5484d;color:#ff9a9a}
#stamp{position:absolute;right:16px;bottom:10px;padding:2px 18px;border:6px solid #e5484d;color:#e5484d;font-size:46px;font-weight:900;border-radius:12px;
 letter-spacing:4px;background:#2b131599;opacity:0}
.badge{position:absolute;width:84px;height:84px;border-radius:50%;padding:20px;opacity:0}
.badge.g{background:#10261b;border:3px solid #2fbf71;color:#7ee2a0;box-shadow:0 0 18px #2fbf7155}
.badge.r{background:#2b1315;border:3px solid #e5484d;color:#ff9a9a;box-shadow:0 0 18px #e5484d55}
.badge i{position:absolute;right:-8px;top:-8px;width:28px;height:28px;border-radius:50%;font-style:normal;font-weight:900;font-size:20px;line-height:26px;text-align:center;color:#07090d}
.badge.g i{background:#2fbf71}.badge.r i{background:#e5484d}
.rec{display:inline-block;width:14px;height:14px;border-radius:50%;background:#e5484d;box-shadow:0 0 12px #e5484d}
#bot{position:absolute;left:0;top:0;width:0;height:0}
#bot .in{position:absolute;left:-42px;top:-128px;width:84px;height:128px}
.ant{position:absolute;left:38px;top:0;width:5px;height:16px;background:#6b7d98}
.ant i{position:absolute;left:-5px;top:-9px;width:15px;height:15px;border-radius:50%;background:#ff6a13;box-shadow:0 0 14px #ff6a13}
.head{position:absolute;left:4px;top:14px;width:76px;height:60px;border-radius:20px;background:linear-gradient(#d7e1ef,#9fb0c8);border:3px solid #5d6f8a}
.eye{position:absolute;top:14px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #44546d;overflow:hidden}
.eye.l{left:11px}.eye.r{left:41px}
.eye b{position:absolute;width:9px;height:9px;border-radius:50%;background:#121a26;left:5px;top:5px}
.eye u{display:none;position:absolute;inset:0;text-decoration:none;font-weight:900;color:#e5484d;font-size:19px;line-height:17px;text-align:center}
.mouth{position:absolute;left:23px;top:40px;width:26px;height:12px;border-bottom:4px solid #121a26;border-radius:0 0 20px 20px}
.bdy{position:absolute;left:14px;top:76px;width:56px;height:40px;border-radius:12px;background:linear-gradient(#8fa2bd,#667a99);border:3px solid #5d6f8a}
.bdy::after{content:"";position:absolute;left:14px;top:11px;width:22px;height:12px;border-radius:4px;background:#12161d;box-shadow:inset 0 0 0 2px #ff6a13}
.feet{position:absolute;left:18px;top:114px;width:48px;height:12px;display:flex;justify-content:space-between}
.feet i{width:20px;height:12px;border-radius:6px;background:#44546d}
#bot[data-mood="x"] .eye b{display:none}#bot[data-mood="x"] .eye u{display:block}
#bot[data-mood="x"] .mouth{border-radius:20px 20px 0 0;border-bottom:0;border-top:4px solid #121a26;top:44px}
#bot[data-mood="o"] .mouth{width:14px;height:14px;left:29px;border:4px solid #121a26;border-radius:50%;top:38px}
#bot[data-mood="flat"] .mouth{border-radius:0;height:0}
#bubble{position:absolute;left:94px;top:58px;min-width:110px;padding:8px 18px;border-radius:18px 18px 18px 4px;background:#f2f5fa;color:#12161d;font-size:25px;font-weight:800;
 box-shadow:0 8px 24px #000a;opacity:0;white-space:nowrap}
#cube{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;transform-style:preserve-3d}
.face{position:absolute;width:110px;height:110px;border-radius:16px;background:#12161d;border:4px solid #ff6a13;overflow:hidden}
.face.stripe::after{content:"";position:absolute;left:0;right:0;bottom:14px;height:18px;background:repeating-linear-gradient(-45deg,#ff6a13 0 9px,#12161d 9px 18px)}
.face svg{position:absolute;inset:0}
.chipbox{position:absolute;left:0;top:0;transform-style:preserve-3d}
.chip{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;padding:9px;border-radius:14px;background:#1b2634;border:2px solid #ff6a13;color:#ffd7bd;box-shadow:0 0 18px #ff6a1388}
#vp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:84px;background:linear-gradient(#06080b00,#06080bf2 62%);pointer-events:none;z-index:1}
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
#brand{position:absolute;left:22px;top:16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
#brand span{color:#ff6a13}
#note{position:absolute;right:22px;top:20px;font-size:13px;color:#7c899b}
#steps{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:14px}
#steps div{width:14px;height:14px;border-radius:50%;border:2px solid #36445a;background:#0b0f15}
#steps div.on{background:#ff6a13;border-color:#ff6a13;box-shadow:0 0 14px #ff6a13;transform:scale(1.35)}
#end{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:radial-gradient(ellipse at center,#0b0f15fc 0,#06080bff 100%);opacity:0}
#end .in{text-align:center}
#end h1{font-size:52px;font-weight:800;letter-spacing:1px;margin-top:14px}
#end h1 span{color:#ff6a13}
#end p{font-size:23px;color:#aab6c6;margin-top:14px}
</style></head><body>

<script>
const X=[0,600,1200,1800,2400], DUR=[4.4,5.6,5.2,4.6,5.0], HOLD=1.8;
const START=[]; {let a=0; for(const d of DUR){START.push(a); a+=d;} }
const TOTAL=DUR.reduce((a,b)=>a+b,0)+HOLD;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const back=p=>{const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const cards=[0,1,2,3,4].map(i=>$('#c'+i));
const world=$('#world'), bot=$('#bot'), bubble=$('#bubble'), btxt=$('#btxt'), antled=$('#antled'), recdot=$('#recdot'), pupils=$$('.eye b'),
 cube=$('#cube'), steps=$$('#steps div'), end=$('#end'), stamp=$('#stamp');
const faces=['rotateY(0deg)','rotateY(90deg)','rotateY(180deg)','rotateY(270deg)','rotateX(90deg)','rotateX(-90deg)'];
$$('.face').forEach((f,i)=>{f.style.transform=faces[i]+' translateZ(55px)'; if(i==0||i==2){f.insertAdjacentHTML('beforeend','<svg viewBox="0 0 128 128" width="104" height="104" style="left:-6px;top:-12px"><polyline points="24,52 42,52 50,30 61,70 72,40 79,52 96,52" fill="none" stroke="#EAF0F8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="101" cy="52" r="7" fill="#FF6A13"/></svg>'); } });
const ICONS=['i-mag','i-pen','i-term','i-flask','i-mag','i-flask','i-term'];
const chips=ICONS.map(n=>{const d=document.createElement('div');d.className='chip';d.innerHTML='<svg class="i"><use href="#'+n+'"/></svg>';$('#chips').appendChild(d);return d;});
function stageAt(t){let i=0;for(let k=0;k<5;k++) if(t>=START[k]) i=k; return i;}
function camX(t){const i=stageAt(t);const lt=t-START[i];if(i===0)return X[0];const p=ease(clamp(lt/1.1));return X[i-1]+(X[i]-X[i-1])*p;}
function pop(el,lt,delay,dur=.5){const p=clamp((lt-delay)/dur);const s=p<=0?0.5:0.5+0.5*back(p);el.style.opacity=clamp(p*2);el.style.transform=(el.dataset.t||'')+` scale(${s})`;}
function localT(k,i,lt){return k===i?lt:(k<i?99:-1);}
function render(ms){
 const t=ms/1000, i=stageAt(t), lt=t-START[i], cx=camX(t);
 const orbit=13*Math.sin(t*.42), tilt=9+4*Math.sin(t*.31);
 const intro=ease(clamp(t/1.2)); const away=(1-intro)*520;
 world.style.transform=`translateZ(${-away}px) rotateX(${tilt}deg) rotateY(${orbit}deg) translateX(${-cx}px)`;
 cards.forEach((c,k)=>{const dx=X[k]-cx, d=clamp(Math.abs(dx)/600);
  c.style.transform=`translate3d(${X[k]}px,0px,${-230*d}px) rotateY(${clamp(dx/600,-1,1)*-26}deg) scale(${1.04-0.1*d})`;
  c.style.opacity=1-0.62*d;});
 const L=k=>localT(k,i,lt);
 $$('#c0 .lamp').forEach((e,n)=>pop(e,L(0),.4+n*1.2)); pop($('#c0 .arrow'),L(0),.9);
 $$('#c0 .tile').forEach((e,n)=>{pop(e,L(0),1.2+n*.7); e.dataset.t=''; if(L(0)>1.9+n*.7&&L(0)<99) e.style.transform+=` rotate(${Math.sin((L(0)-1.9-n*.7)*14)*Math.max(0,1-(L(0)-1.9-n*.7)*1.6)*7}deg)`;});
 $$('#c1 .tile').forEach((e,n)=>{pop(e,L(1),.3+n*.25); const cyc=(L(1)-1.0)/0.9; e.classList.toggle('lit',L(1)>=1.0&&L(1)<99&&Math.floor(cyc)%4===n);});
