[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-black-box"
version = "0.1.0"
description = "A flight recorder for coding agents: run tasks headlessly, record a redacted ledger, grade and tag behaviours."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
blackbox = "blackbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/blackbox"]
pythonpath = ["src"]
addopts = "-q --ignore-glob=tests/blackbox/fixtures/*"
